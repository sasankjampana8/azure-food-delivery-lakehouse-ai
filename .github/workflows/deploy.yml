name: Deploy to existing Azure dev environment
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - uses: actions/checkout@v4
      - name: Check checked-in artifacts
        run: python scripts/validate_repo.py
      - name: Log in with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update Synapse notebooks
        env:
          AZURE_SYNAPSE_WORKSPACE: ${{ vars.AZURE_SYNAPSE_WORKSPACE }}
        run: |
          set -euo pipefail
          for notebook in nb_01_bronze_silver nb_02_validate_silver nb_03_build_gold nb_04_validate_gold; do
            az synapse notebook set \
              --workspace-name "$AZURE_SYNAPSE_WORKSPACE" \
              --name "$notebook" \
              --file "@synapse/notebooks/$notebook.ipynb" \
              --only-show-errors
          done
      - name: Deploy ADF artifacts
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_FACTORY_NAME: ${{ vars.AZURE_FACTORY_NAME }}
          AZURE_SYNAPSE_WORKSPACE: ${{ vars.AZURE_SYNAPSE_WORKSPACE }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_SOURCE_STORAGE_ACCOUNT: ${{ vars.AZURE_SOURCE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          subscription_id="$(az account show --query id -o tsv)"
          workspace_id="/subscriptions/$subscription_id/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Synapse/workspaces/$AZURE_SYNAPSE_WORKSPACE"
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file adf/ARMTemplateForFactory.json \
            --parameters \
              "factoryName=$AZURE_FACTORY_NAME" \
              "ls_blob_source_properties_typeProperties_serviceEndpoint=https://$AZURE_SOURCE_STORAGE_ACCOUNT.blob.core.windows.net/" \
              "ls_adls_lake_properties_typeProperties_url=https://$AZURE_STORAGE_ACCOUNT.dfs.core.windows.net/" \
              "ls_synapse_artifacts_properties_typeProperties_endpoint=https://$AZURE_SYNAPSE_WORKSPACE.dev.azuresynapse.net" \
              "synapseWorkspaceResourceId=$workspace_id" \
            --only-show-errors
